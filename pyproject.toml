[project]
name = "job-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7", "pyyaml>=6", "httpx>=0.27", "anthropic>=1.0",
  "langfuse>=2.50", "openpyxl>=3.1", "pypdf>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
